name: Build Windows
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  build-student:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows student app
        run: dotnet publish src/ClassRoom.Student/ClassRoom.Student.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/student-win-x64
      - name: Upload student app
        uses: actions/upload-artifact@v4
        with:
          name: classroom-control-windows
          path: artifacts/student-win-x64/**
